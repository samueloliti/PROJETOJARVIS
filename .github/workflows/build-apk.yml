name: Compilar APK do Jarvis Caseiro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK de depuração
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle (sem precisar do wrapper local)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Conferir se google-services.json existe
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json não encontrado. Baixe-o no console do Firebase (Configurações do projeto > Seus apps > Android) e adicione-o em app/google-services.json antes de compilar."
            exit 1
          fi

      - name: Compilar APK de depuração
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-caseiro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
